[build-system]
requires = ["poetry-core>=1.1.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "vtpwebapi"
version = "0.2.0"
description = "A Python API web server to demonstrate the use of VoteTrackerPlus for a mock election"
authors = ["Neil Johnson <neil@cadent.com>","Sandy Currier <windoverwater@users.noreply.github.com>"]
license = "GNU General Public License v2.0"
readme = "README.md"
packages = [{include = "vtp", from = "src"}]

[tool.poetry.dependencies]
deepdiff = "^9.1.0"
fastapi = "^0.139.2"
httpx2 = "^2.5.0"
importlib-resources = "^7.1.0"
networkx = "^3.6.1"
pyaml = "^26.2"
pyinputplus = "^0.2.12"
python = ">=3.14,<3.14.1 || >3.14.1,<3.15"
qrcode = "^8.2"
uvicorn = "^0.51.0"
segno = "^1.6.1"
requests = "^2.31.0"

[tool.poetry.group.dev.dependencies]
black = "^26.5.1"
flake8 = "^7.3.0"
isort = "^8.0.1"
mccabe = "^0.7.0"
mypy = "^2.3.0"
pylint = "^4.0.6"
pytest = "^9.1.1"
pytest-cov = "^7.0.0"
